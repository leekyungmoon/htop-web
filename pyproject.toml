[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "htop-web"
dynamic = ["version"]
description = "A web interface of htop: monitor Linux hosts at a glance"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "leekyungmoon" }]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "asyncssh>=2.14",
]
keywords = ["htop", "monitoring", "ssh", "websocket", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-aiohttp>=1.1",
]

[project.scripts]
htop-web = "htop_web.cli:main"

[project.urls]
Homepage = "https://github.com/leekyungmoon/htop-web"
Source = "https://github.com/leekyungmoon/htop-web"
Issues = "https://github.com/leekyungmoon/htop-web/issues"

[tool.setuptools]
packages = ["htop_web", "htop_web.static"]

[tool.setuptools.package-data]
"htop_web.static" = ["*"]

[tool.setuptools.dynamic]
version = { attr = "htop_web.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
