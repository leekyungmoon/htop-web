name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # A regular (not editable) install, so a file missing from the package fails here.
      - run: python -m pip install '.[test]'
      # The pytest command, not "python -m pytest", so tests import the installed package.
      - run: pytest -v

  collector-python36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the collector under Python 3.6, fed on stdin as htop-web does over SSH
        run: |
          docker run --rm -i python:3.6-slim python3 -u - --once --interval 0.5 \
            < htop_web/collector.py > snapshot.json
          python3 - <<'PY'
          import json
          snap = json.load(open("snapshot.json"))
          assert snap["v"] == 1 and snap["procs"] and snap["mem"]["total"] > 0, snap
          print(snap["host"], snap["ncpu"], "CPUs,", len(snap["procs"]), "processes")
          PY
